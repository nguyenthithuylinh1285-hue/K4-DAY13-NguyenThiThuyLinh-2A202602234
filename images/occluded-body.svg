<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><rect width="900" height="300" fill="white"/><style>text{font:22px sans-serif;fill:#203046}.small{font-size:17px}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#2456ad"/></marker></defs><text x="35" y="38">Điểm thưa / bị che: cân nhắc thân thật và độ chắc chắn</text><rect x="80" y="100" width="260" height="100" fill="#e6edf6" stroke="#52647c" stroke-width="3"/><rect x="80" y="100" width="85" height="100" fill="#91a9cb"/><rect x="80" y="100" width="85" height="100" fill="none" stroke="#bd4242" stroke-width="4"/><text class="small" x="60" y="250">Không co hộp theo phần đang nhìn thấy</text><rect x="560" y="100" width="260" height="100" fill="#e6edf6" stroke="#2456ad" stroke-width="4" stroke-dasharray="9 6"/><rect x="560" y="100" width="85" height="100" fill="#91a9cb"/><text class="small" x="505" y="250">Phần suy ra cần bằng chứng; thiếu thì ghi chưa chắc</text></svg>